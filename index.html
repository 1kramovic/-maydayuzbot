<style>
:root{
  --bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#F5F5F7;--ink:#1D1D1F;--ink-2:#6E6E73;--line:#E1E5ED;
  --work:#0071E3;--study:#0071E3;--fun:#0071E3;--money:#6E6E73;--money-fill:#0071E3;
  --urgent:#FF3B30;--warn:#FF9500;--on-color:#FFFFFF;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 20px 40px -30px rgba(0,0,0,.16);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1D1D1F;--surface-2:#000000;--ink:#F5F5F7;--ink-2:#86868B;--line:#2A2A2C;
    --work:#2997FF;--study:#2997FF;--fun:#2997FF;--money:#86868B;--money-fill:#2997FF;
    --urgent:#FF453A;--warn:#FFD60A;--on-color:#FFFFFF;
    --shadow:0 1px 1px rgba(0,0,0,.3),0 20px 40px -30px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1D1D1F;--surface-2:#000000;--ink:#F5F5F7;--ink-2:#86868B;--line:#2A2A2C;
  --work:#2997FF;--study:#2997FF;--fun:#2997FF;--money:#86868B;--money-fill:#2997FF;
  --urgent:#FF453A;--warn:#FFD60A;--on-color:#FFFFFF;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 20px 40px -30px rgba(0,0,0,.7);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  --tint:var(--work);--tint2:var(--fun);
  margin:0;background:var(--bg);
  background:
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Golos Text","Segoe UI",Roboto,sans-serif;letter-spacing:-0.1px;
}
body[data-view="work"]{--tint:var(--work);--tint2:var(--study)}
body[data-view="study"]{--tint:var(--study);--tint2:var(--work)}
body[data-view="fun"]{--tint:var(--fun);--tint2:var(--money-fill)}
body[data-view="money"]{--tint:var(--money-fill);--tint2:var(--fun)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--sc,var(--work));outline-offset:2px;border-radius:8px}

.s-home{--sc:var(--work)}
.s-work{--sc:var(--work)}
.s-study{--sc:var(--study)}
.s-fun{--sc:var(--fun)}
.s-money{--sc:var(--money)}

/* Иконки */
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--sc) 13%,transparent);color:var(--sc)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Каркас */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;padding:26px 14px 20px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 62%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 24px;font:700 15px/1.2 -apple-system,"SF Pro Display","Golos Text",system-ui,sans-serif;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--work),var(--fun) 62%,var(--money-fill));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#snav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 10px;border:0;border-radius:16px;background:transparent;color:var(--ink-2);font-weight:500;text-align:left;transition:background-color .2s,box-shadow .2s}
.nav:hover{background:color-mix(in srgb,var(--sc) 7%,transparent)}
.nav small{margin-left:auto;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.nav[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--surface);box-shadow:var(--shadow)}
.nav[aria-current="page"] .ic{background:var(--sc);color:var(--on-color)}
.side-foot{margin-top:auto;display:grid;gap:12px;padding:0 6px}
.side-foot p{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.theme-btn{min-height:42px;border:0;background:var(--surface-2);border-radius:999px;padding:0 14px;font-weight:500;font-size:14px}
.col{padding:26px clamp(16px,4vw,48px) 72px;width:100%;max-width:1000px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.search{position:relative;flex:1;max-width:540px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-2);pointer-events:none}
.search .inp{padding-left:42px;background:var(--surface-2);border:0;border-radius:14px;box-shadow:none}
.top .theme-btn{display:none}
.bnav{display:none}

@media (max-width:819px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .col{padding-bottom:120px}
  .top .theme-btn{display:block;flex:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav .nav{flex-direction:column;justify-content:center;gap:3px;min-height:64px;padding:7px 0 6px;border-radius:0;font-size:10.5px;text-align:center;background:transparent!important;box-shadow:none!important}
  .bnav .nav small{display:none}
  .bnav .ic{width:38px;height:28px;border-radius:14px;background:transparent}
  .bnav .nav[aria-current="page"] .ic{background:var(--sc)}
}

/* Типографика */
.h1{font:700 clamp(24px,5vw,34px)/1.12 -apple-system,"SF Pro Display","Golos Text",system-ui,sans-serif;letter-spacing:-.025em}
.sub{color:var(--ink-2);margin-top:6px}
.h2{font-size:18px;font-weight:600;margin:32px 0 12px}
.hint{font-size:13.5px;color:var(--ink-2)}
.hint b,.sub b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Поля и кнопки */
.inp{width:100%;min-height:46px;border:1px solid transparent;background:var(--surface-2);color:var(--ink);border-radius:13px;padding:9px 13px;transition:background-color .15s,border-color .15s,box-shadow .15s}
textarea.inp{resize:vertical;line-height:1.45}
.inp::placeholder{color:var(--ink-2);opacity:.8}
.inp:focus{outline:none;background:var(--surface);border-color:var(--sc,var(--work));box-shadow:0 0 0 4px color-mix(in srgb,var(--sc,var(--work)) 18%,transparent)}
.btn{min-height:46px;padding:0 22px;border:0;border-radius:999px;background:linear-gradient(180deg,color-mix(in srgb,var(--sc,var(--work)) 82%,#fff),var(--sc,var(--work)));color:var(--on-color);font-weight:600;letter-spacing:-.01em;box-shadow:0 10px 18px -12px var(--sc,var(--work));transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn-ghost{min-height:46px;padding:0 22px;border:0;border-radius:999px;background:var(--surface-2);font-weight:600}
.link-danger{justify-self:start;background:none;border:0;padding:8px 0;color:var(--urgent);font-weight:500}
.lab{display:grid;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.lab .v{color:var(--ink);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;min-height:46px;display:flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--surface-2);font-size:14px;font-weight:500;transition:background-color .15s}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--sc,var(--ink));border-color:var(--sc,var(--ink));color:var(--on-color)}
.chip.dashed{border-style:dashed;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;justify-self:start}
.seg button{border:0;background:transparent;min-height:38px;padding:0 18px;border-radius:10px;font-weight:500;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,27,38,.14)}
.subj-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subj-add .inp{width:200px}

/* Панели и строки */
.panel{background:var(--surface-2);border:0;border-radius:28px;box-shadow:none}
.panel>.list{border-radius:21px;overflow:hidden}
.form{padding:16px;display:grid;gap:12px;margin:18px 0}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form-row .inp,.form-row .lab{flex:1 1 130px;width:auto}
.form-row .btn{flex:none}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;gap:14px;padding:14px 18px;border-top:1px solid var(--line);transition:background-color .15s}
.row:hover{background:color-mix(in srgb,var(--sc,var(--ink)) 4%,transparent)}
.list>.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-title{display:block;width:100%;text-align:left;background:none;border:0;padding:1px 0;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.is-done .row-title{color:var(--ink-2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-2) 55%,transparent)}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.meta:empty{display:none}
.late{color:var(--urgent);font-weight:600}
.secname{color:var(--sc);font-weight:600}
.snippet{font-size:14px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.snippet:empty{display:none}
.pill{font-size:12.5px;font-weight:600;padding:1px 10px;border-radius:999px}
.p1{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.p2{color:var(--urgent);background:color-mix(in srgb,var(--urgent) 14%,transparent)}
.tag{border:0;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;padding:1px 9px;border-radius:999px}
.chk{position:relative;flex:none;width:24px;height:24px;margin-top:0;padding:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--sc,var(--ink-2)) 70%,var(--surface));background:transparent;display:grid;place-items:center;color:var(--on-color);transition:background-color .18s,border-color .18s,transform .18s}
.chk::after{content:"";position:absolute;inset:-10px}
.chk:hover{border-color:var(--sc,var(--ink-2))}
.chk[aria-checked="true"]{background:var(--sc,var(--ink-2));border-color:var(--sc,var(--ink-2))}
.chk svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:opacity .18s,transform .18s}
.chk[aria-checked="true"] svg{opacity:1;transform:none}
.empty{padding:34px 22px;text-align:center;color:var(--ink-2);border-style:dashed;box-shadow:none;background:transparent}
.notebar{flex:none;width:4px;border-radius:2px;background:var(--sc)}
.st{flex:none;align-self:flex-start;min-height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--sc);background:transparent;color:var(--sc);font-size:13px;font-weight:600;white-space:nowrap}
.st[data-s="1"]{background:color-mix(in srgb,var(--sc) 16%,transparent)}
.st[data-s="2"]{background:var(--sc);color:var(--on-color)}
.res{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.done summary{cursor:pointer;min-height:44px;display:flex;align-items:center;margin-top:16px;padding:0 6px;color:var(--ink-2);font-weight:500}
.done .panel{margin-bottom:8px}

/* Редактор */
.ed{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:14px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cl{list-style:none;margin:6px 0 8px;padding:0}
.cl li{display:flex;align-items:center;gap:10px;min-height:38px}
.cl .chk{width:20px;height:20px}
.cl .chk svg{width:11px;height:11px}
.cl .txt{flex:1;background:none;border:0;text-align:left;padding:4px 0;overflow-wrap:anywhere}
.cl .cl-done{color:var(--ink-2);text-decoration:line-through}
.x{flex:none;border:0;background:none;color:var(--ink-2);width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1}
.x:hover{background:var(--surface-2)}

/* Вкладки */
.tabs{display:flex;gap:8px;margin-top:18px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 17px;border-radius:999px;border:0;background:var(--surface-2);color:var(--ink-2);font-weight:500;font-size:14.5px;transition:background-color .15s}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--sc);border-color:var(--sc);color:var(--on-color);font-weight:600}

/* Шапка раздела */
.sec-hero{display:flex;align-items:center;gap:16px;padding:22px;border-radius:26px;border:0;background:var(--surface-2);box-shadow:none}
.sec-hero .ic{width:58px;height:58px;border-radius:19px;background:var(--sc);color:var(--on-color)}
.sec-hero .ic svg{width:29px;height:29px}
.sh-t{flex:1;min-width:0}
.sh-n{text-align:right;flex:none}
.sh-n b{display:block;font:700 30px/1 -apple-system,"SF Pro Display","Golos Text",system-ui,sans-serif;letter-spacing:-.02em;color:var(--sc)}
.sh-n span{font-size:13px;color:var(--ink-2)}
.cur{flex:none;min-width:96px}

/* Главный экран */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px;border-radius:28px;border:0;box-shadow:none;
  background:var(--surface-2)}
.hero-sum{margin-top:14px;font-size:17px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:7px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none;display:inline-block}
.ring{width:144px;height:144px;display:block}
.rg{fill:none;stroke-width:12;stroke-linecap:round}
.rg-track{stroke:color-mix(in srgb,var(--sc) 24%,var(--surface))}
.rg-fill{stroke:var(--sc)}
.rg-empty{stroke:color-mix(in srgb,var(--ink-2) 22%,var(--surface))}
.rn{font:700 25px -apple-system,"SF Pro Display","Golos Text",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.rl{font:500 11px "Golos Text",system-ui,sans-serif;fill:var(--ink-2);text-anchor:middle}
.intro .ring{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.82) rotate(-25deg)}}
@media (max-width:520px){.hero{padding:20px;gap:12px}.ring{width:108px;height:108px}.rn{font-size:23px}.rl{font-size:10px}}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:20px}
.dash .qa{margin:0}
@media (max-width:919px){.dash{grid-template-columns:minmax(0,1fr)}}

/* Доходы */
.mcard{padding:20px;display:grid;gap:13px;background:linear-gradient(150deg,color-mix(in srgb,var(--money-fill) 26%,var(--surface)),var(--surface) 72%)}
.mc-head{display:flex;align-items:center;gap:12px}
.mc-head h2{font-size:17px;font-weight:600;line-height:1.2}
.mc-more{margin-left:auto;background:none;border:0;color:var(--money);font-weight:600;font-size:14px;min-height:40px;padding:0 4px}
.amt{font:700 clamp(30px,7vw,44px)/1.05 -apple-system,"SF Pro Display","Golos Text",system-ui,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amt2{font:700 clamp(18px,3.4vw,22px)/1.2 -apple-system,"SF Pro Display","Golos Text",system-ui,sans-serif;letter-spacing:-.02em;color:var(--muted);margin-top:-4px}
.mc-tot{display:grid;gap:2px}
.seg{display:inline-flex;border-radius:999px;background:var(--pill,color-mix(in srgb,var(--ink) 6%,transparent));padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qa-money{align-items:center}
.tp{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px}
.tp-in{background:color-mix(in srgb,#2fbf71 20%,transparent);color:#1f8f54}
.tp-exp{background:color-mix(in srgb,#e5484d 18%,transparent);color:#c8323a}
.tp-debt{background:color-mix(in srgb,#f5a524 20%,transparent);color:#a86b0d}
.amt-r{font-weight:700;font-variant-numeric:tabular-nums}
.amt-exp,.amt-debt{color:#c8323a}
.amt-in{color:#1f8f54}
.b6.neg i{background:#e5484d}
.src b.neg{color:#c8323a}
.mfilt{margin:14px 0}
.conv{padding:20px;display:grid;gap:12px}
.conv-out{font:700 clamp(22px,4vw,28px)/1.2 -apple-system,"SF Pro Display","Golos Text",sans-serif;letter-spacing:-.02em}
.rate{max-width:220px}
.npta{width:100%;resize:vertical;font:inherit}
.ck{width:26px;height:26px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:12px;color:#fff}
.row.is-done .ck{background:var(--ink);border-color:var(--ink)}
.row.is-done .row-title{text-decoration:line-through;color:var(--muted)}
.delta{font-size:14px;font-weight:600;color:var(--ink-2)}
.delta.up{color:var(--study)}
.delta.down{color:var(--urgent)}
.gbar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--money-fill) 24%,var(--surface-2));overflow:hidden}
.gbar i{display:block;height:100%;width:var(--w);border-radius:5px;background:linear-gradient(90deg,var(--money-fill),color-mix(in srgb,var(--money-fill) 60%,#D6336C));transition:width .4s}

.mtotal{padding:22px;display:grid;gap:14px;margin:18px 0;background:linear-gradient(140deg,color-mix(in srgb,var(--money-fill) 28%,var(--surface)),var(--surface) 75%)}
.mt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}
.mon-nav{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.mon-nav .chip{min-width:44px;min-height:44px;padding:0 14px;font-size:18px}

.amt-r{margin-left:auto;align-self:flex-start;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.timer{padding:26px 18px;text-align:center;display:grid;gap:20px;justify-items:center;margin:18px 0}

.tr-bg{fill:none;stroke:color-mix(in srgb,var(--sc) 16%,var(--surface-2));stroke-width:12}

.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:124px;padding:16px 16px 12px}
.wkc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12.5px;color:var(--ink-2)}

.wkb{width:100%;max-width:34px;min-height:3px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--sc),color-mix(in srgb,var(--sc) 60%,var(--surface)))}

/* Уведомления */
#toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px));pointer-events:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

function $(s,r){return (r||document).querySelector(s);}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function fmtDate(s){var p=s.split('-');return (+p[2])+' '+MON[+p[1]-1];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function parseTags(s){
  var tags=[];
  var title=s.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,function(m,sp,tg){tags.push(tg.toLowerCase());return sp;}).replace(/\s+/g,' ').trim();
  return {title:title,tags:tags.filter(function(t,i){return tags.indexOf(t)===i;})};
}
function tagsOf(s){
  var out=[],m,re=/(?:^|\s)#([\p{L}\p{N}_-]+)/gu;
  while((m=re.exec(s))){var t=m[1].toLowerCase();if(out.indexOf(t)<0)out.push(t);}
  return out;
}

function toast(msg,o){
  o=o||{};
  var box=$('#toasts');
  var el=document.createElement('div');
  el.className='toast';
  el.setAttribute('role','status');
  var sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  var b=document.createElement('button');b.type='button';
  if(o.action){b.textContent=o.action;b.onclick=function(){if(o.fn)o.fn();el.remove();};}
  else if(o.sticky){b.textContent='Ок';b.onclick=function(){el.remove();};}
  else b=null;
  if(b)el.appendChild(b);
  box.appendChild(el);
  while(box.children.length>3)box.removeChild(box.firstChild);
  if(!o.sticky)setTimeout(function(){el.remove();},5500);
}
function beep(){
  try{
    var A=window.AudioContext||window.webkitAudioContext;var a=new A();
    var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=880;
    g.gain.setValueAtTime(0.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2,a.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.6);
    o.start();o.stop(a.currentTime+0.65);
  }catch(e){}
}

/* ---------- Деньги ---------- */
function fmtNum(n){
  try{return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2,minimumFractionDigits:(Math.round(n*100)%100?2:0)}).format(n);}
  catch(e){return String(n);}
}
var TYPE={in:{label:'Доход',sign:1},exp:{label:'Расход',sign:-1},debt:{label:'Долг',sign:-1}};
function money(n,cur){cur=cur||'UZS';var v=fmtNum(Math.abs(n));return cur==='USD'?'$'+v:v+'\u00A0сум';}
function compact(n){
  if(n>=1e6)return (Math.round(n/1e5)/10)+' млн';
  if(n>=1000)return (Math.round(n/100)/10)+' тыс';
  return String(Math.round(n));
}
function parseAmt(v){var n=parseFloat(String(v).replace(/[\s\u00A0]/g,'').replace(',','.'));return isFinite(n)?Math.round(n*100)/100:NaN;}
function curMon(){return today().slice(0,7);}
function monShift(ym,n){var p=ym.split('-'),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function monLabel(ym){var p=ym.split('-');return MONTHS[+p[1]-1]+' '+p[0];}
function netSum(ym,cur){var s=0;S.income.forEach(function(e){if(e.date.slice(0,7)===ym&&e.cur===cur)s+=TYPE[e.type].sign*e.amount;});return Math.round(s*100)/100;}
function monSum(ym){return netSum(ym,'UZS');}
function toUZS(n,cur){return cur==='USD'?n*(S.rate||12700):n;}
function deltaHtml(ym){
  var cur=monSum(ym),prev=monSum(monShift(ym,-1));
  if(!prev)return cur?'<span class="delta">В прошлом месяце доходов не было</span>':'';
  var p=Math.round((cur-prev)/prev*100);
  if(p===0)return '<span class="delta">Столько же, сколько в прошлом месяце</span>';
  return '<span class="delta '+(p>0?'up':'down')+'">'+(p>0?'▲ +':'▼ −')+Math.abs(p)+'% к прошлому месяцу</span>';
}
function goalHtml(total){
  if(!(S.goal>0))return '<p class="hint">Цель на месяц не задана.</p>';
  var p=Math.min(100,Math.round(total/S.goal*100)),left=Math.max(0,S.goal-total);
  return '<div class="gbar"><i style="--w:'+p+'%"></i></div><p class="hint">'+p+'% от цели '+money(S.goal)+(left?', осталось '+money(left):', цель достигнута')+'</p>';
}

  var c={};
  S.income.forEach(function(e){if(e.src)c[e.src]=(c[e.src]||0)+1;});

function isLate(t){
  if(t.done||!t.due)return false;
  var td=today();
  return t.due<td||(t.due===td&&!!t.time&&t.time<nowHM());
}
function dueText(t){
  if(!t.due)return '';
  var td=today(),s;
  if(t.due===td)s='Сегодня';
  else if(t.due===addDays(td,1))s='Завтра';
  else if(t.due===addDays(td,-1))s='Вчера';
  else s=fmtDate(t.due);
  if(t.time)s+=' в '+t.time;
  return s;
}
function cmpDue(a,b){
  var da=a.due?a.due+(a.time||'99:99'):'9999',db=b.due?b.due+(b.time||'99:99'):'9999';
  if(da!==db)return da<db?-1:1;
  if(a.pri!==b.pri)return b.pri-a.pri;
  return a.created-b.created;
}
function cmpPri(a,b){
  if(a.pri!==b.pri)return b.pri-a.pri;
  var ta=a.time||'99:99',tb=b.time||'99:99';
  if(ta!==tb)return ta<tb?-1:1;
  return a.created-b.created;
}

  var d=dueText(t);

  var cl=t.checklist||[];
  if(cl.length)p.push('<span>'+cl.filter(function(c){return c.done;}).length+'/'+cl.length+' пунктов</span>');
  if(t.subj&&subjName(t.subj))p.push('<span>'+esc(subjName(t.subj))+'</span>');
  (t.tags||[]).forEach(function(g){p.push('<button class="tag" type="button" data-act="tag" data-tag="'+esc(g)+'">#'+esc(g)+'</button>');});
  return p.join('');

function greet(){
  var h=new Date().getHours();
  return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
}
function ringSvg(list){
  var R=48,C=2*Math.PI*R,SW=12,G=8,out='';
  if(!list.length){
    out='<circle class="rg rg-empty" cx="60" cy="60" r="48"/>';
  }else{
    var secs=['work','study','fun'].map(function(k){return {k:k,a:list.filter(function(t){return t.sec===k;})};}).filter(function(x){return x.a.length;});
    var acc=0;
    secs.forEach(function(x){
      var share=x.a.length/list.length*C,single=secs.length===1;
      var len=single?C-0.01:Math.max(0.1,share-G-SW);
      var off=single?0:-(acc+(G+SW)/2);
      acc+=share;
      var d=x.a.filter(function(t){return t.done;}).length/x.a.length;
      out+='<circle class="rg rg-track s-'+x.k+'" cx="60" cy="60" r="48" stroke-dasharray="'+len.toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/>';
      if(d>0)out+='<circle class="rg rg-fill s-'+x.k+'" cx="60" cy="60" r="48" stroke-dasharray="'+Math.max(0.1,len*d).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/>';
    });
  }
  return '<g transform="rotate(-90 60 60)">'+out+'</g>';
}

/* ---------- Таймер ---------- */
var TC=2*Math.PI*96;
var T={mode:'focus',running:false,endAt:0,left:S.pomo.work*60,tick:null};
function tDur(){return (T.mode==='focus'?S.pomo.work:S.pomo.rest)*60;}
function fmtT(s){return pad(Math.floor(s/60))+':'+pad(s%60);}
function tPaint(){
  var el=$('#tTime');if(el)el.textContent=fmtT(T.left);
  var arc=$('#tArc');if(arc)arc.setAttribute('stroke-dashoffset',(TC*(1-T.left/tDur())).toFixed(2));
  var g=$('#tGo');if(g)g.textContent=T.running?'Пауза':'Старт';
  document.title=T.running?fmtT(T.left)+' '+(T.mode==='focus'?'Фокус':'Перерыв'):'Всё в одном';
}
function tStart(){
  if(T.running)return;
  T.endAt=Date.now()+T.left*1000;T.running=true;
  T.tick=setInterval(tTick,250);
}
function tPause(){
  if(!T.running)return;
  T.left=Math.max(0,Math.round((T.endAt-Date.now())/1000));
  T.running=false;clearInterval(T.tick);
}
function tTick(){
  var l=Math.ceil((T.endAt-Date.now())/1000);
  if(l<=0){T.left=0;tDone();}
  else if(l!==T.left){T.left=l;tPaint();}
}
function tDone(){
  clearInterval(T.tick);T.running=false;
  if(T.mode==='focus'){
    var k=today();
    var L=S.pomo.log[k]||(S.pomo.log[k]={n:0,min:0});
    L.n++;L.min+=S.pomo.work;save();
    T.mode='rest';T.left=tDur();
    toast('Фокус завершён. Пора сделать перерыв.',{sticky:true});
  }else{
    T.mode='focus';T.left=tDur();
    toast('Перерыв закончился. Можно возвращаться к делам.',{sticky:true});
  }
  beep();
  if($('#tTime'))render();
  tPaint();
}

        '<circle class="tr-fg" id="tArc" cx="110" cy="110" r="96" transform="rotate(-90 110 110)" stroke-dasharray="'+TC.toFixed(2)+' '+TC.toFixed(2)+'" stroke-dashoffset="0"/></svg>'+
        '<div class="time" id="tTime" role="timer">'+fmtT(T.left)+'</div></div>'+
      '<div class="t-btns"><button class="btn" type="button" id="tGo" data-k="t-go" data-act="t-toggle">'+(T.running?'Пауза':'Старт')+'</button>'+

      '</div>'+

/* ---------- Раздел, поиск ---------- */
function vSection(sec){
  var tabs=TABS[sec],tab=UI.tab[sec];
  if(!tabs.some(function(t){return t[0]===tab;}))tab=UI.tab[sec]=tabs[0][0];
  var sub={work:'Задачи, чек-листы и сроки в одном месте.',study:'Задания, конспекты и таймер для занятий.',fun:'Что посмотреть, прочитать и чем заняться.'}[sec];
  var openN=S.tasks.filter(function(t){return t.sec===sec&&!t.done;}).length;
  var body=tab==='tasks'?tabTasks(sec):tab==='notes'?tabNotes(sec):tab==='timer'?tabTimer():tabItems(tab);
  return '<div class="s-'+sec+'"><header class="sec-hero"><span class="ic">'+ICON[sec]+'</span>'+
    '<div class="sh-t"><h1 class="h1">'+SEC[sec]+'</h1><p class="sub">'+sub+'</p></div>'+
    '<div class="sh-n"><b>'+openN+'</b><span>открыто</span></div></header>'+
    '<div class="tabs" role="tablist">'+tabs.map(function(t){
      return '<button class="tab" type="button" role="tab" aria-selected="'+(tab===t[0])+'" data-k="tab-'+t[0]+'" data-act="tab" data-sec="'+sec+'" data-v="'+t[0]+'">'+t[1]+'</button>';
    }).join('')+'</div><div class="tabbody">'+body+'</div></div>';
}
function vSearch(){
  var raw=UI.q.trim(),q=raw.toLowerCase(),isTag=q.charAt(0)==='#',tq=q.slice(1);
  function hit(text,tags){
    tags=tags||[];
    if(isTag)return tags.some(function(g){return g.indexOf(tq)===0;});
    return text.toLowerCase().indexOf(q)>=0||tags.some(function(g){return g.indexOf(q)>=0;});
  }
  var R=[];
  S.tasks.forEach(function(t){
    var txt=[t.title,subjName(t.subj)].concat((t.checklist||[]).map(function(c){return c.t;})).join(' ');
    if(hit(txt,t.tags))R.push({id:t.id,sec:t.sec,tab:'tasks',label:'Задача',title:t.title,done:t.done});
  });
  S.notes.forEach(function(n){
    if(hit(n.title+' '+(n.body||'')+' '+subjName(n.subj),n.tags))R.push({id:n.id,sec:n.sec,tab:'notes',label:n.sec==='study'?'Конспект':'Заметка',title:n.title});
  });
  S.items.forEach(function(it){
    if(hit(it.title+' '+(it.note||''),[]))R.push({id:it.id,sec:'fun',tab:it.kind,label:KIND[it.kind].one,title:it.title});
  });
  if(!isTag)S.income.forEach(function(e){
    if(hit((e.src||'')+' '+e.amount,[]))R.push({id:e.id,sec:'money',tab:'',label:'Доход',title:(e.src||'Без источника')+', '+money(e.amount)});
  });
  var head='<h1 class="h1">Поиск</h1><p class="sub">'+(R.length?'Найдено: '+R.length+'.':'')+'</p><div style="height:18px"></div>';
  if(!R.length)return head+'<div class="panel empty">Ничего не нашлось по запросу «'+esc(raw)+'». Попробуйте другое слово или тег с решёткой, например #работа.</div>';
  return head+'<div class="panel"><ul class="list">'+R.map(function(r){
    return '<li class="row s-'+r.sec+(r.done?' is-done':'')+'"><button class="res" type="button" data-act="goto" data-sec="'+r.sec+'" data-tab="'+r.tab+'" data-id="'+r.id+'">'+
      '<span class="row-title">'+esc(r.title||'Без названия')+'</span>'+
      '<span class="meta"><span class="secname s-'+r.sec+'">'+SEC[r.sec]+'</span><span>'+r.label+'</span></span></button></li>';
  }).join('')+'</ul></div>';
}

var M=$('#main');
function renderNav(){
  var cur=UI.view==='search'?UI.prev:UI.view;

  counts.home=S.tasks.filter(function(t){return !t.done&&t.due&&t.due<=td;}).length;
  var items=[['home','Сегодня'],['work','Работа'],['study','Учёба'],['fun','Отдых'],['money','Финансы'],['notepad','Блокнот']];

        '<span class="ic">'+ICON[x[0]]+'</span><span>'+x[1]+'</span><small>'+(counts[x[0]]||'')+'</small></button>';
    }).join('');
  }

  $('#bnav').innerHTML=html('b-');

function render(){
  var a=document.activeElement,k=a&&a.dataset?a.dataset.k:null,sel=null;
  if(k&&a.selectionStart!=null){try{sel=[a.selectionStart,a.selectionEnd];}catch(e){}}
  document.body.dataset.view=UI.view==='search'?UI.prev:UI.view;
  renderNav();
  M.innerHTML=UI.view==='home'?vHome():UI.view==='search'?vSearch():UI.view==='money'?vMoney():UI.view==='notepad'?vNotepad():vSection(UI.view);
  if(k){
    var n=document.querySelector('[data-k="'+CSS.escape(k)+'"]');
    if(n){
      n.focus({preventScroll:true});
      if(sel){try{n.setSelectionRange(sel[0],sel[1]);}catch(e){}}
    }
  }
  tPaint();
}
function clearSearch(){UI.q='';$('#q').value='';}
function focusK(k){var n=document.querySelector('[data-k="'+k+'"]');if(n)n.focus();}

/* ---------- Действия ---------- */
function qaAdd(){
  var q=UI.qa,text=q.text.trim();
  if(!text){focusK('qa-text');return;}
  if(q.mode==='task'){
    var p=parseTags(text);
    if(!p.title){focusK('qa-text');return;}
    S.tasks.push({id:uid(),title:p.title,sec:q.sec,done:false,pri:q.pri,due:q.due||'',time:'',tags:p.tags,subj:'',checklist:[],created:Date.now()});
    toast('Задача добавлена в «'+SEC[q.sec]+'»');
  }else{
    var lines=text.split('\n'),rest=lines.slice(1).join('\n').trim();
    var title=parseTags(lines[0]).title||'Без названия';
    if(q.sec==='fun'){
      S.items.push({id:uid(),kind:'idea',title:title,st:0,note:rest,created:Date.now()});
      toast('Идея добавлена в «Отдых»');
    }else{
      S.notes.push({id:uid(),sec:q.sec,title:title,body:rest,tags:tagsOf(text),subj:'',created:Date.now()});
      toast('Заметка добавлена в «'+SEC[q.sec]+'»');
    }
  }
  q.text='';save();render();focusK('qa-text');
}
function taskAdd(sec){
  var inp=$('#f-title'),p=parseTags(inp.value);
  if(!p.title){inp.focus();return;}
  var t={id:uid(),title:p.title,sec:sec,done:false,pri:+$('#f-pri').value||0,due:$('#f-due').value||'',time:$('#f-time').value||'',tags:p.tags,
    subj:sec==='study'&&$('#f-subj')?$('#f-subj').value:'',checklist:[],created:Date.now()};
  if(t.time&&!t.due)t.due=today();
  S.tasks.push(t);UI.draft={};save();render();
  var n=$('#f-title');if(n)n.focus();
}
function noteAdd(sec){
  var ti=$('#f-ntitle'),bo=$('#f-nbody'),title=ti.value.trim(),body=bo.value.trim();
  if(!title&&!body){ti.focus();return;}
  var tags=tagsOf(title+' '+body);
  title=parseTags(title).title||body.split('\n')[0].slice(0,60);
  S.notes.push({id:uid(),sec:sec,title:title,body:body,tags:tags,subj:sec==='study'&&$('#f-nsubj')?$('#f-nsubj').value:'',created:Date.now()});
  UI.draft={};save();render();
  var n=$('#f-ntitle');if(n)n.focus();
}
function itemAdd(kind){
  var inp=$('#f-item'),v=inp.value.trim();
  if(!v){inp.focus();return;}
  S.items.push({id:uid(),kind:kind,title:v,st:0,note:'',created:Date.now()});
  UI.draft={};save();render();
  var n=$('#f-item');if(n)n.focus();
}
function incAdd(pre){
  var am=$('[data-k="'+pre+'-amt"]'),sr=$('[data-k="'+pre+'-src"]'),dt=$('[data-k="'+pre+'-date"]');
  if(!am)return;
  var a=parseAmt(am.value);
  if(!(a>0)){am.focus();toast('Введите сумму больше нуля');return;}
  var date=dt&&dt.value?dt.value:today(),type=UI.qa.mtype||'in',cur=UI.qa.mcur||'UZS';
  S.income.push({id:uid(),amount:a,src:sr?sr.value.trim():'',date:date,type:type,cur:cur,created:Date.now()});
  if(pre==='mv')UI.mon=date.slice(0,7);
  UI.draft={};save();render();
  toast(TYPE[type].label+' добавлен'+(type==='in'?'':(type==='exp'?'а':'')) +': '+money(a,cur));
  focusK(pre+'-amt');
}
function clAdd(id,el){
  var t=byId(S.tasks,id),v=el.value.trim();
  if(!t||!v)return;
  (t.checklist=t.checklist||[]).push({id:uid(),t:v,done:false});
  save();render();
}
function subjAdd(){
  var el=$('[data-k="subj-new"]');
  var v=el?el.value.trim():'';
  if(!v){if(el)el.focus();return;}
  var s={id:uid(),name:v};S.subjects.push(s);
  UI.subj=s.id;UI.addSubj=false;save();render();
}
function del(type,id){
  var arr=type==='task'?S.tasks:type==='note'?S.notes:type==='inc'?S.income:S.items;
  var i=-1;for(var j=0;j<arr.length;j++){if(arr[j].id===id){i=j;break;}}
  if(i<0)return;
  var it=arr.splice(i,1)[0];save();render();
  toast('Удалено',{action:'Вернуть',fn:function(){arr.splice(Math.min(i,arr.length),0,it);save();render();}});
}
function go(sec,tab,id){
  UI.view=sec;UI.draft={};UI.open[id]=true;
  if(sec==='money'){
    var e=byId(S.income,id);if(e)UI.mon=e.date.slice(0,7);
  }else{
    UI.tab[sec]=tab;UI.subj='all';UI.ff='all';
    if(tab==='tasks'){var t=byId(S.tasks,id);if(t&&t.done)UI.showDone[sec]=true;}
  }
  clearSearch();render();
  requestAnimationFrame(function(){
    var el=M.querySelector('[data-id="'+id+'"]');
    if(el)el.scrollIntoView({block:'center'});
  });
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,t;
  switch(a){
    case 'nav':clearSearch();UI.view=el.dataset.v;UI.draft={};render();window.scrollTo(0,0);break;
    case 'theme':S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];applyTheme();save();break;
    case 'qa-mode':UI.qa.mode=el.dataset.v;render();break;
    case 'qa-sec':UI.qa.sec=el.dataset.v;render();break;
    case 'qa-add':qaAdd();break;
    case 'toggle-task':t=byId(S.tasks,id);if(t){t.done=!t.done;t.doneAt=t.done?Date.now():0;save();render();}break;
    case 'open':UI.open[id]=!UI.open[id];render();break;
    case 'tab':UI.tab[el.dataset.sec]=el.dataset.v;UI.ff='all';UI.draft={};render();break;
    case 'task-add':taskAdd(el.dataset.sec);break;
    case 'note-add':noteAdd(el.dataset.sec);break;
    case 'item-add':itemAdd(el.dataset.kind);break;
    case 'inc-add':incAdd(el.dataset.prefix);break;
    case 'qa-mtype':UI.qa.mtype=el.dataset.v;render();break;
    case 'qa-mcur':UI.qa.mcur=el.dataset.v;render();break;
    case 'mfilt':UI.mfilt=el.dataset.v;render();break;
    case 'conv-from':UI.conv=UI.conv||{amt:100,from:'USD'};UI.conv.from=el.dataset.v;render();break;
    case 'np-prev':UI.np=addDays(UI.np||today(),-1);render();break;
    case 'np-next':UI.np=addDays(UI.np||today(),1);render();break;
    case 'np-today':UI.np=today();render();break;
    case 'np-add':{
      var ni=$('[data-k="np-new"]'),v=ni?ni.value.trim():'';
      if(!v){if(ni)ni.focus();break;}
      S.notepad.monthly.push({id:uid(),text:v,done:false});save();render();focusK('np-new');
      break;
    }
    case 'np-toggle':{var it=byId(S.notepad.monthly,id);if(it){it.done=!it.done;save();render();}break;}
    case 'np-del':{S.notepad.monthly=S.notepad.monthly.filter(function(x){return x.id!==id;});save();render();break;}
    case 'np-reset':S.notepad.monthly.forEach(function(x){x.done=false;});save();render();break;
    case 'mon-prev':UI.mon=monShift(UI.mon||curMon(),-1);render();break;
    case 'mon-next':UI.mon=monShift(UI.mon||curMon(),1);render();break;
    case 'mon-today':UI.mon=curMon();render();break;
    case 'mon-set':UI.mon=el.dataset.v;render();break;
    case 'cl-toggle':
      t=byId(S.tasks,id);
      if(t){(t.checklist||[]).forEach(function(c){if(c.id===el.dataset.c)c.done=!c.done;});save();render();}
      break;
    case 'cl-del':
      t=byId(S.tasks,id);
      if(t){t.checklist=(t.checklist||[]).filter(function(c){return c.id!==el.dataset.c;});save();render();}
      break;
    case 'del':del(el.dataset.type,id);break;
    case 'cycle':t=byId(S.items,id);if(t){t.st=(t.st+1)%3;save();render();}break;
    case 'filter':UI.ff=el.dataset.v;render();break;
    case 'subj':UI.subj=id;render();break;
    case 'subj-open':UI.addSubj=true;render();setTimeout(function(){focusK('subj-new');},0);break;
    case 'subj-cancel':UI.addSubj=false;render();break;
    case 'subj-add':subjAdd();break;
    case 'subj-del':{
      var s=byId(S.subjects,UI.subj);if(!s)break;
      var i=S.subjects.indexOf(s),aff=[];
      S.subjects.splice(i,1);
      S.tasks.concat(S.notes).forEach(function(x){if(x.subj===s.id){x.subj='';aff.push(x);}});
      UI.subj='all';save();render();
      toast('Предмет удалён',{action:'Вернуть',fn:function(){S.subjects.splice(Math.min(i,S.subjects.length),0,s);aff.forEach(function(x){x.subj=s.id;});save();render();}});
      break;
    }
    case 'tag':{
      var v='#'+el.dataset.tag;
      if(UI.view!=='search'){UI.prev=UI.view;UI.view='search';}
      UI.q=v;$('#q').value=v;render();window.scrollTo(0,0);
      break;
    }
    case 'goto':go(el.dataset.sec,el.dataset.tab,id);break;
    case 't-mode':tPause();T.mode=el.dataset.v;T.left=tDur();render();break;
    case 't-toggle':if(T.running)tPause();else tStart();tPaint();break;
    case 't-reset':tPause();T.left=tDur();tPaint();break;
  }
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  var el=e.target,a=el.dataset&&el.dataset.enter;
  if(!a)return;
  e.preventDefault();
  switch(a){
    case 'qa-add':qaAdd();break;
    case 'task-add':taskAdd(el.dataset.sec);break;
    case 'cl-add':clAdd(el.dataset.id,el);break;
    case 'item-add':itemAdd(el.dataset.kind);break;
    case 'inc-add':incAdd(el.dataset.prefix);break;
    case 'subj-add':subjAdd();break;
  }
});

  }
  if(d.k&&/^(f-|mc-|mv-)/.test(d.k)&&el.type!=='date'&&el.type!=='time'&&el.tagName!=='SELECT'){UI.draft[d.k]=el.value;}

    case 'qa-text':UI.qa.text=el.value;break;
    case 'task-title':
      x=byId(S.tasks,d.id);
      if(x){x.title=el.value;rt=row&&row.querySelector('.row-title');if(rt)rt.textContent=x.title||'Без названия';saveSoon();}
      break;
    case 'note-title':
      x=byId(S.notes,d.id);
      if(x){x.title=el.value;rt=row&&row.querySelector('.row-title');if(rt)rt.textContent=x.title||'Без названия';saveSoon();}
      break;
    case 'note-body':
      x=byId(S.notes,d.id);
      if(x){x.body=el.value;var sn=row&&row.querySelector('.snippet');if(sn)sn.textContent=x.body.slice(0,240);saveSoon();}
      break;
    case 'note-tags':
      x=byId(S.notes,d.id);
      if(x){
        x.tags=el.value.split(/[\s,]+/).map(function(g){return g.replace(/^#/,'').toLowerCase();}).filter(function(g,i,arr){return g&&arr.indexOf(g)===i;});
        var mm=row&&row.querySelector('.meta');if(mm)mm.innerHTML=noteMeta(x);
        saveSoon();
      }
      break;
    case 'item-note':
      x=byId(S.items,d.id);
      if(x){x.note=el.value;saveSoon();}
      break;
  }
});

document.addEventListener('change',function(e){
  var el=e.target,d=el.dataset||{},x,row=el.closest?el.closest('.row'):null;
  switch(d.change){
    case 'qa-due':UI.qa.due=el.value;break;
    case 'qa-pri':UI.qa.pri=+el.value;break;
    case 'cur':S.cur=el.value;save();render();break;
    case 'rate':{var r=parseAmt(el.value);S.rate=r>0?r:S.rate;el.value=S.rate;save();render();break;}
    case 'goal':{
      var g=parseAmt(el.value);
      S.goal=g>0?g:0;
      if(!(g>0))el.value='';
      save();
      var gb=$('#goalBox');
      if(gb)gb.innerHTML=goalHtml(monSum(UI.mon||curMon()));
      break;
    }
    case 'inc-field':{
      x=byId(S.income,d.id);if(!x)break;
      if(d.field==='amount'){
        var am=parseAmt(el.value);
        if(!(am>0)){el.value=x.amount;break;}
        x.amount=am;el.value=am;
      }else if(d.field==='date'){
        if(!el.value){el.value=x.date;break;}
        x.date=el.value;
      }else x.src=el.value.trim();
      save();
      if(row){
        var rt2=row.querySelector('.row-title');if(rt2)rt2.textContent=x.src||'Без источника';
        var dd=row.querySelector('.meta .d');if(dd)dd.textContent=fmtDate(x.date);
        var ar=row.querySelector('.amt-r');if(ar)ar.textContent='+'+money(x.amount);
      }
      break;
    }
    case 'task-field':
      x=byId(S.tasks,d.id);if(!x)break;
      x[d.field]=d.field==='pri'?+el.value:el.value;
      if(d.field==='due'||d.field==='time'){
        x.rem=false;
        if(d.field==='time'&&x.time&&!x.due){
          x.due=today();
          var di=document.querySelector('[data-k="'+x.id+'-due"]');if(di)di.value=x.due;
        }
      }
      save();
      var m=row&&row.querySelector('.meta');
      if(m)m.innerHTML=metaHtml(x,row.dataset.showsec==='1');
      break;
    case 'note-subj':
      x=byId(S.notes,d.id);
      if(x){x.subj=el.value;save();var nm=row&&row.querySelector('.meta');if(nm)nm.innerHTML=noteMeta(x);}
      break;
    case 't-work':
    case 't-rest':{
      var v=Math.max(1,Math.min(d.change==='t-work'?180:60,Math.round(+el.value)||1));
      if(d.change==='t-work')S.pomo.work=v;else S.pomo.rest=v;
      el.value=v;save();
      if(!T.running&&((T.mode==='focus')===(d.change==='t-work'))){T.left=tDur();tPaint();}
      break;
    }
  }
});

document.addEventListener('toggle',function(e){
  var el=e.target;
  if(el&&el.dataset&&el.dataset.done)UI.showDone[el.dataset.done]=el.open;
},true);

/* ---------- Напоминания ---------- */
function checkReminders(){
  var now=Date.now(),ch=false;
  S.tasks.forEach(function(t){
    if(t.done||t.rem||!t.due||!t.time)return;
    var at=new Date(t.due+'T'+t.time+':00').getTime();
    if(at<=now&&now-at<6*3600*1000){
      t.rem=true;ch=true;
      toast('Напоминание: '+t.title,{sticky:true});
      beep();
      try{if(window.Notification&&Notification.permission==='granted')new Notification('Напоминание',{body:t.title});}catch(e){}
    }
  });
  if(ch)save();
}

/* ---------- Старт ---------- */
applyTheme();
render();
checkReminders();
setInterval(checkReminders,20000);
setTimeout(function(){document.body.classList.remove('intro');},1500);
})();
</script>
</body>
</html>
